name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME}"
          out_dir="dist/hn_${version}_${GOOS}_${GOARCH}"
          mkdir -p "${out_dir}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${out_dir}/hn${{ matrix.ext }}" .
          cp README.md "${out_dir}/" 2>/dev/null || true

      - name: archive
        id: archive
        run: |
          version="${GITHUB_REF_NAME}"
          base="hn_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${base}.zip" "${base}"
            echo "asset=dist/${base}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${base}.tar.gz" "${base}"
            echo "asset=dist/${base}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: hn_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.archive.outputs.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
